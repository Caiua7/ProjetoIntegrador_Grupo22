[project]
name = "pricing-core"
version = "0.1.0"
description = "Motor de precificação do NeoPrice — contrato e regras de domínio puras."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
