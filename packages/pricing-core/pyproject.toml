[project]
name = "pricing-core"
version = "0.1.0"
description = "Motor de precificação do NeoPrice — contrato e (futuramente) regras de domínio puras."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing_core"]
