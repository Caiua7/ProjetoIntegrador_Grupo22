name: Defeito
description: Algo já entregue que não está funcionando.
title: "O que está errado, em uma linha"
labels: ["bug"]
body:
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true

  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: caso
    attributes:
      label: Caso homologado relacionado
      placeholder: "Caso 07 — esperado R$ 48,32 · obtido R$ 48,35"

  - type: dropdown
    id: onde
    attributes:
      label: Onde ocorre
      options:
        - Local
        - Staging
        - Produção
    validations:
      required: true

  - type: dropdown
    id: gravidade
    attributes:
      label: Gravidade
      options:
        - Bloqueia a sprint
        - Tem contorno
        - Incômodo menor
    validations:
      required: true
